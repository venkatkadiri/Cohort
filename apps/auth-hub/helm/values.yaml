replicaCount: 1

image:
  repository: cohort/auth-hub
  tag: "1.0.0" # Target for CI/CD automated chore PRs
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8003
  grpcPort: 50054

probes:
  readinessPath: /health
  livenessPath: /health

env:
  PORT: "8003"
  JWT_SECRET: "cohort-jwt-secret-dev"

ingress:
  enabled: false
  className: nginx
  host: auth-hub.cohort.mesh
  path: /
  pathType: Prefix
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
