name: Apps.Deploy.Application

run-name: Deploy to ${{ inputs.override_envs || 'dev-eu-west1' }} ref ${{ inputs.override_target_revision || github.event.client_payload.ref || github.ref }}

on:
  repository_dispatch:
    types:
      - artifacts-published

  workflow_dispatch:
    inputs:
      override_envs:
        required: true
        default: '["dev-eu-west1"]'
        description: Override to which envs to deploy (must be valid JSON array ex. ["dev-eu-west1","stage","prod"])
      override_regions:
        required: false
        default: '["eu-west-1"]'
        description: Override to which regions to deploy (must be valid JSON array ex. ["eu-west-1"])
      override_target_revision:
        required: true
        default: main
        description: Git ref (branch, tag, commit sha) from which to deploy
      application_name:
        required: false
        default: "all"
        description: Target application name (e.g. video-hub, domain-hub) or 'all'

defaults:
  run:
    shell: bash

jobs:
  parse-matrix:
    name: Prepare Deployment Matrix
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set-matrix.outputs.envs }}
    steps:
      - name: Parse Environments
        id: set-matrix
        run: |
          ENVS='${{ inputs.override_envs }}'
          if [ -z "$ENVS" ] || [ "$ENVS" == "[]" ]; then
            ENVS='["dev-eu-west1"]'
          fi
          echo "envs=${ENVS}" >> $GITHUB_OUTPUT

  deploy:
    name: Helm.Deploy
    needs: parse-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.parse-matrix.outputs.environments) }}
    steps:
      - name: Checkout Target Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.override_target_revision || github.event.client_payload.ref || github.ref }}

      - name: Set up Helm 3
        uses: azure/setup-helm@v4
        with:
          version: v3.17.1

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - name: Set Environment Configuration
        id: env-config
        run: |
          ENV_NAME="${{ matrix.env }}"
          case "$ENV_NAME" in
            dev|dev-eu-west1)
              echo "namespace=cohort-dev-eu-west1" >> $GITHUB_OUTPUT
              echo "values_file=helm/cohort-platform/values-dev-eu-west1.yaml" >> $GITHUB_OUTPUT
              ;;
            stage)
              echo "namespace=cohort-stage" >> $GITHUB_OUTPUT
              echo "values_file=helm/cohort-platform/values-stage.yaml" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "namespace=cohort-prod" >> $GITHUB_OUTPUT
              echo "values_file=helm/cohort-platform/values-prod.yaml" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "namespace=cohort-${ENV_NAME}" >> $GITHUB_OUTPUT
              echo "values_file=helm/cohort-platform/values-${ENV_NAME}.yaml" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Deploy via Helm 3
        run: |
          NAMESPACE="${{ steps.env-config.outputs.namespace }}"
          VALUES_FILE="${{ steps.env-config.outputs.values_file }}"
          APP="${{ inputs.application_name || github.event.client_payload.service || 'all' }}"
          
          echo "🚀 Deploying Application '$APP' to Environment '${{ matrix.env }}' (Namespace: $NAMESPACE)..."
          
          if [ "$APP" == "all" ]; then
            helm dependency update ./helm/cohort-platform
            helm upgrade --install cohort-platform ./helm/cohort-platform \
              -f "$VALUES_FILE" \
              --namespace "$NAMESPACE" \
              --create-namespace \
              --dry-run
          else
            echo "Deploying specific service '$APP'..."
            helm upgrade --install "$APP" "apps/${APP}/helm" \
              -f "apps/${APP}/helm/values-${{ matrix.env }}.yaml" \
              --namespace "$NAMESPACE" \
              --create-namespace \
              --dry-run
          fi
          echo "✅ Deployment dry-run succeeded for ${{ matrix.env }}."
