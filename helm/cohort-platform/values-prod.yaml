# ==============================================================================
# Cohort Platform Environment: production (High-Availability & Auto-scaling)
# ==============================================================================
global:
  environment: production
  region: eu-west-1
  domainSuffix: cohort.mesh

postgres:
  replicaCount: 1
  persistence:
    size: 100Gi
    storageClass: 'gp3'
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

temporal:
  server:
    replicaCount: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
  ui:
    replicaCount: 2

elk:
  elasticsearch:
    replicaCount: 3
    discoveryType: multi-node
    javaOpts: '-Xms4g -Xmx4g'
    persistence:
      size: 100Gi
    resources:
      requests:
        cpu: 1000m
        memory: 4Gi
      limits:
        cpu: 4000m
        memory: 8Gi
  logstash:
    replicaCount: 2
  kibana:
    replicaCount: 2

domain-hub:
  replicaCount: 3
  ingress:
    enabled: true
    host: api.cohort.mesh
    annotations:
      kubernetes.io/tls-acme: 'true'
      cert-manager.io/cluster-issuer: letsencrypt-prod
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

