# Multi-Environment UI Ingress Configuration for prod
ingressUIs:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  hosts:
    web: app.cohort.local
    kibana: kibana.cohort.local
    temporal: temporal.cohort.local
    grafana: grafana.cohort.local
  tls:
    - secretName: cohort-prod-uis-tls
      hosts:
        - app.cohort.local
        - kibana.cohort.local
        - temporal.cohort.local
        - grafana.cohort.local
