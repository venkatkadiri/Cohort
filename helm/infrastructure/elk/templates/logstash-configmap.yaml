apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elk.fullname" . }}-logstash-pipeline
  labels:
    {{- include "elk.labels" . | nindent 4 }}
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
      tcp {
        port => 5000
        codec => json_lines
      }
      http {
        port => 8080
        codec => json
      }
    }

    filter {
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
          target => "parsed"
          skip_on_invalid_json => true
        }
      }

      mutate {
        add_field => {
          "[@metadata][target_index]" => "cohort-logs-%{+YYYY.MM.dd}"
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "%{[@metadata][target_index]}"
      }
    }
