apiVersion: v1
kind: ConfigMap
metadata:
  name: cohort-config
  namespace: cohort
  labels:
    app.kubernetes.io/part-of: cohort-platform
data:
  # Database Config
  POSTGRES_DB: "temporal"
  POSTGRES_HOST: "postgres.cohort.svc.cluster.local"
  POSTGRES_PORT: "5432"
  
  # Temporal Server Config
  TEMPORAL_ADDRESS: "temporal.cohort.svc.cluster.local:7233"
  TEMPORAL_TASK_QUEUE: "cohort-task-queue"
  TEMPORAL_CORS_ORIGINS: "http://localhost:3000,http://web.cohort.svc.cluster.local:3000"
  
  # Python Domain Service Config
  GRPC_PORT: "50051"
  HTTP_PORT: "8000"
  SLOT_GENERATION_DAYS: "30"
  GRPC_SERVER_ADDRESS: "domain-service.cohort.svc.cluster.local:50051"
  
  # Node / Web Frontend Config
  NODE_ENV: "production"
  PORT: "3000"
  BETTER_AUTH_ENABLED: "0"
