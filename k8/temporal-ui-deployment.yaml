apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: cohort
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: cohort-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
        app.kubernetes.io/part-of: cohort-platform
    spec:
      containers:
        - name: temporal-ui
          image: temporalio/ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: TEMPORAL_ADDRESS
            - name: TEMPORAL_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: TEMPORAL_CORS_ORIGINS
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
