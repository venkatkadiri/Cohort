apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: cohort
  labels:
    app.kubernetes.io/name: temporal-worker
    app.kubernetes.io/part-of: cohort-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-worker
        app.kubernetes.io/part-of: cohort-platform
    spec:
      containers:
        - name: temporal-worker
          image: cohort/domain-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - app/temporal/worker.py
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: DATABASE_URL
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: TEMPORAL_ADDRESS
            - name: TEMPORAL_TASK_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: TEMPORAL_TASK_QUEUE
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_PASS
            - name: GOOGLE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: GOOGLE_CLIENT_EMAIL
            - name: GOOGLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: GOOGLE_PRIVATE_KEY
            - name: GOOGLE_CALENDAR_ID
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: GOOGLE_CALENDAR_ID
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
