apiVersion: v1
kind: Secret
metadata:
  name: cohort-secrets
  namespace: cohort
  labels:
    app.kubernetes.io/part-of: cohort-platform
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "temporal"
  POSTGRES_PASSWORD: "temporal"
  DATABASE_URL: "postgresql://temporal:temporal@postgres.cohort.svc.cluster.local:5432/temporal"
  
  # Temporal Database Credentials
  POSTGRES_PWD: "temporal"
  
  # SMTP Email Credentials (optional)
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  
  # Google Calendar Service Account (optional)
  GOOGLE_CLIENT_EMAIL: ""
  GOOGLE_PRIVATE_KEY: ""
  GOOGLE_CALENDAR_ID: ""
  
  # Better Auth Secrets (optional)
  BETTER_AUTH_SECRET: "cohort-super-secret-auth-key-change-in-prod"
  BETTER_AUTH_CLIENT_ID: ""
  BETTER_AUTH_CLIENT_SECRET: ""
