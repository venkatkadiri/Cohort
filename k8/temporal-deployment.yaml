apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: cohort
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: cohort-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: cohort-platform
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: POSTGRES_PWD
            - name: POSTGRES_SEEDS
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: POSTGRES_HOST
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 20
