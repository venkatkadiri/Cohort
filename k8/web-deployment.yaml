apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cohort
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: cohort-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: cohort-platform
    spec:
      containers:
        - name: web
          image: cohort/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: PORT
            - name: GRPC_SERVER_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: GRPC_SERVER_ADDRESS
            - name: BETTER_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: BETTER_AUTH_ENABLED
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: BETTER_AUTH_CLIENT_ID
            - name: BETTER_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: BETTER_AUTH_CLIENT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
