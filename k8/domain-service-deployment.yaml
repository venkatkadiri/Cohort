apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-service
  namespace: cohort
  labels:
    app.kubernetes.io/name: domain-service
    app.kubernetes.io/part-of: cohort-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: domain-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domain-service
        app.kubernetes.io/part-of: cohort-platform
    spec:
      containers:
        - name: domain-service
          image: cohort/domain-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: DATABASE_URL
            - name: GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: GRPC_PORT
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: HTTP_PORT
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: TEMPORAL_ADDRESS
            - name: TEMPORAL_TASK_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: TEMPORAL_TASK_QUEUE
            - name: SLOT_GENERATION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: cohort-config
                  key: SLOT_GENERATION_DAYS
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: SMTP_PASS
            - name: GOOGLE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: GOOGLE_CLIENT_EMAIL
            - name: GOOGLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: GOOGLE_PRIVATE_KEY
            - name: GOOGLE_CALENDAR_ID
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: GOOGLE_CALENDAR_ID
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
