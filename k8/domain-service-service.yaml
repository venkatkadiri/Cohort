apiVersion: v1
kind: Service
metadata:
  name: domain-service
  namespace: cohort
  labels:
    app.kubernetes.io/name: domain-service
    app.kubernetes.io/part-of: cohort-platform
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: domain-service
