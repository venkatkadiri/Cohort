name: _Validate.Lint.PR

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

defaults:
  run:
    shell: bash

jobs:
  validate-pr-title:
    name: Validate.PR.Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PR Title with Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
          requireScope: false

  lint-and-format:
    name: Validate.Lint.Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Prettier Formatting Check
        run: pnpm format

      - name: TypeScript Typecheck
        run: pnpm typecheck

  unused-packages-check:
    name: Validate.Unused.Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Check for Unused Dependencies
        run: pnpm deps:check
