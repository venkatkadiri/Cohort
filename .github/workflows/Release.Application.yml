name: Release.Application

run-name: Build & Publish ${{ inputs.service_name || 'apps' }} (${{ inputs.image_tag || github.sha }})

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Service to build and publish (or 'all')
        required: true
        default: all
        type: choice
        options:
          - all
          - domain-hub
          - booking-hub
          - notification-hub
          - search-hub
          - auth-hub
          - video-hub
          - configuration-hub
          - leader-hub
          - transaction-hub
          - web
      image_tag:
        description: Custom image tag (defaults to commit SHA)
        required: false
        default: ''
      docker_repository:
        description: Target Docker registry/repository
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'apps/**'

defaults:
  run:
    shell: bash

jobs:
  determine-services:
    name: Determine Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - name: Set Services Matrix
        id: set-services
        run: |
          TARGET="${{ inputs.service_name || 'all' }}"
          if [ "$TARGET" == "all" ]; then
            echo 'services=["domain-hub","booking-hub","notification-hub","search-hub","auth-hub","video-hub","configuration-hub","leader-hub","transaction-hub","web"]' >> $GITHUB_OUTPUT
          else
            echo "services=[\"$TARGET\"]" >> $GITHUB_OUTPUT
          fi

  build-and-publish:
    name: Docker.Build.Publish
    needs: determine-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.services) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Registry and Tags
        id: meta
        run: |
          SERVICE="${{ matrix.service }}"
          REGISTRY="${{ inputs.docker_repository || vars.DOCKER_REGISTRY || 'ghcr.io' }}"
          REPO_OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${REGISTRY}/${REPO_OWNER}/${SERVICE}"

          # Read package version from values.yaml or package.json
          VERSION=""
          if [ -f "apps/${SERVICE}/helm/values.yaml" ]; then
            VERSION=$(grep -E '^\s*tag:' "apps/${SERVICE}/helm/values.yaml" | awk '{print $2}' | tr -d '"' || true)
          fi

          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${VERSION:-${GITHUB_SHA::8}}"
          fi

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker_repository && '' || vars.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.version != '' && format('{0}:{1}', steps.meta.outputs.image_name, steps.meta.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch Artifact Published Event
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: artifacts-published
          client-payload: '{"service": "${{ matrix.service }}", "ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "tag": "${{ steps.meta.outputs.tag }}"}'
