apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cohort-stage
  namespace: argocd
  labels:
    app.kubernetes.io/name: cohort-platform
    app.kubernetes.io/part-of: cohort
    environment: stage
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cohort-platform
  source:
    repoURL: 'https://github.com/venkatkadiri/Cohort.git'
    targetRevision: HEAD
    path: helm/cohort-platform
    helm:
      valueFiles:
        - values-stage.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cohort-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
