apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: cohort.local
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: domain-hub
                port:
                  number: 8000
          - path: /api/videos
            pathType: Prefix
            backend:
              service:
                name: video-hub
                port:
                  number: 8005
          - path: /api/config
            pathType: Prefix
            backend:
              service:
                name: config-hub
                port:
                  number: 8006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
