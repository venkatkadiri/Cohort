apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-hub
  labels:
    app: booking-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-hub
  template:
    metadata:
      labels:
        app: booking-hub
    spec:
      containers:
        - name: booking-hub
          image: cohort/booking-hub:latest
          ports:
            - containerPort: 8004
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: PORT
              value: "8004"
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: booking-hub
  labels:
    app: booking-hub
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      name: http
    - port: 50051
      targetPort: 50051
      name: grpc
  selector:
    app: booking-hub
