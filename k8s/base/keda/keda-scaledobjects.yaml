apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: web-scaler
  labels:
    app: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicaCount: 2
  maxReplicaCount: 15
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 20
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: cohort_http_requests_total
        query: sum(rate(cohort_http_requests_total{service="web"}[1m]))
        threshold: '50'
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: domain-hub-scaler
  labels:
    app: domain-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: domain-hub
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 0
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: cohort_http_requests_total
        query: sum(rate(cohort_http_requests_total{service="domain-hub"}[1m]))
        threshold: '75'
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: cohort_active_requests
        query: sum(cohort_active_requests{service="domain-hub"})
        threshold: '25'
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: booking-hub-scaler
  labels:
    app: booking-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-hub
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 180
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: cohort_http_requests_total
        query: sum(rate(cohort_http_requests_total{service="booking-hub"}[1m]))
        threshold: '35'
    - type: postgresql
      metadata:
        query: 'SELECT count(*) FROM "Booking" WHERE status = ''PENDING'';'
        targetQueryValue: '5'
      authenticationRef:
        name: keda-trigger-auth-postgres
---
