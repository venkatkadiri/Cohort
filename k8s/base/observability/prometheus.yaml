apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'cohort-hub-domain'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['domain-hub:8000']
      - job_name: 'cohort-spoke-booking'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['booking-hub:8004']
      - job_name: 'cohort-spoke-notification'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['notification-hub:8001']
      - job_name: 'cohort-spoke-search'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['search-hub:8002']
      - job_name: 'cohort-spoke-auth'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['auth-hub:8003']
      - job_name: 'cohort-spoke-video'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['video-hub:8005']
      - job_name: 'cohort-spoke-config-hub'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['configuration-hub:8006']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.1
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
