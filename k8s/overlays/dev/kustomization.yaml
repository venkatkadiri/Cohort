apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cohort-dev
namePrefix: dev-

resources:
  - ../../base

configMapGenerator:
  - name: platform-env-config
    literals:
      - APP_ENV=dev
      - NODE_ENV=development
      - LOG_LEVEL=debug

patches:
  - target:
      kind: Ingress
      name: platform-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.cohort.local
      - op: replace
        path: /metadata/name
        value: dev-platform-ingress
