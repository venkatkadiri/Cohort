replicaCount: 1

image:
  repository: cohort/leader-hub
  tag: "0.1.0" # Target for CI/CD automated chore PRs
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8007

probes:
  readinessPath: /health
  livenessPath: /health

env:
  NODE_ENV: production
  TEMPORAL_ADDRESS: temporal:7233

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
