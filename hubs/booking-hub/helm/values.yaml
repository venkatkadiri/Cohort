replicaCount: 1

image:
  repository: cohort/booking-hub
  tag: "1.0.0" # Target for CI/CD automated chore PRs
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8004
  grpcPort: 50051

probes:
  readinessPath: /health
  livenessPath: /health

env:
  PORT: "8004"
  DATABASE_URL: "postgresql://temporal:temporal@postgres:5432/temporal"
  TEMPORAL_ADDRESS: "temporal:7233"

ingress:
  enabled: false
  className: nginx
  host: booking-hub.cohort.mesh
  path: /
  pathType: Prefix
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
