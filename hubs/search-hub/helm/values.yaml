replicaCount: 1

image:
  repository: cohort/search-hub
  tag: "1.0.0" # Target for CI/CD automated chore PRs
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8002
  grpcPort: 50053

probes:
  readinessPath: /health
  livenessPath: /health

env:
  PORT: "8002"

ingress:
  enabled: false
  className: nginx
  host: search-hub.cohort.mesh
  path: /
  pathType: Prefix
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
