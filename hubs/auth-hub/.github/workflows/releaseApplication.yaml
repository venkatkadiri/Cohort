name: auth-hub.Release.Application

run-name: Build & Publish auth-hub (${{ inputs.image_tag || github.sha }})

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (defaults to commit SHA)'
        required: false
        default: ''
      docker_repository:
        description: 'Target container registry (defaults to ghcr.io)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'hubs/auth-hub/**'

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    name: Docker.Build.Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Image Name & Tag
        id: meta
        run: |
          REGISTRY="${{ inputs.docker_repository || vars.DOCKER_REGISTRY || 'ghcr.io' }}"
          REPO_OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${REGISTRY}/${REPO_OWNER}/auth-hub"
          
          VERSION=""
          if [ -f "hubs/auth-hub/helm/values.yaml" ]; then
            VERSION=$(grep -E '^\s*tag:' "hubs/auth-hub/helm/values.yaml" | awk '{print $2}' | tr -d '"' || true)
          fi
          
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${VERSION:-${GITHUB_SHA::8}}"
          fi
          
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker_repository && '' || vars.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hubs/auth-hub/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.version != '' && format('{0}:{1}', steps.meta.outputs.image_name, steps.meta.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
